# Default rule set (pycodestyle errors + pyflakes): catches real bugs without
# imposing a style on the whole codebase.
extend-exclude = ["migrations/versions"]

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# Models are imported inside create_app() on purpose so SQLAlchemy and Alembic
# register their tables; they look unused to a linter.
"app/__init__.py" = ["F401"]
